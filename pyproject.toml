[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptiveserve"
version = "0.1.0"
description = "Resource-aware adaptive image classification research prototype"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.2.6", "pillow==11.2.1", "torch==2.7.1", "torchvision==0.22.1",
  "onnx==1.18.0", "onnxruntime==1.22.0", "fastapi==0.115.12",
  "uvicorn==0.34.3", "python-multipart==0.0.20", "psutil==7.0.0",
  "pandas==2.2.3", "matplotlib==3.10.3", "seaborn==0.13.2",
  "scikit-learn==1.6.1", "pybind11==2.13.6",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["adaptiveserve*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "build"]
markers = ["integration: requires exported pretrained models and native extension"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

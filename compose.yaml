services:
  adaptiveserve:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      ADAPTIVESERVE_BACKEND: cpp
      ADAPTIVESERVE_THREADS: "1"
    volumes:
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
      - ./history:/app/history
      - ./results:/app/results:ro
      - ./frontend/public/results:/app/frontend/public/results:ro
